# This file is included by fwup.conf when provisioning a device. It can be
# replaced with a project-specific file by setting NERVES_PROVISIONING.
#
# The serial number used by `boardid` (see /etc/boardid.config) is stored in
# the U-Boot environment if NERVES_SERIAL_NUMBER is set at burn time.

uboot_setenv(uboot-env, "nerves_serial_number", "\${NERVES_SERIAL_NUMBER}")
