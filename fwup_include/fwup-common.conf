# Firmware metadata and disk layout shared by fwup.conf and fwup-ops.conf
#
# All of these can be overridden using environment variables of the same name.
#
#  Run 'fwup -m' to query values in a .fw file.
#  Use 'fw_printenv' to query values on the target.
#
# These are used by Nerves libraries to introspect.
define(NERVES_FW_PRODUCT, "Nerves Firmware")
define(NERVES_FW_DESCRIPTION, "")
define(NERVES_FW_VERSION, "${NERVES_SDK_VERSION}")
define(NERVES_FW_PLATFORM, "rk3326_frame156")
define(NERVES_FW_ARCHITECTURE, "aarch64")
define(NERVES_FW_AUTHOR, "")

# The eMMC is pinned to mmc0 by the device tree aliases
define(NERVES_FW_DEVPATH, "/dev/mmcblk0")
define(NERVES_FW_APPLICATION_PART0_DEVPATH, "/dev/mmcblk0p8") # Linux part number is 1-based
define(NERVES_FW_APPLICATION_PART0_FSTYPE, "ext4")
define(NERVES_FW_APPLICATION_PART0_TARGET, "/root")
define(NERVES_PROVISIONING, "${NERVES_SYSTEM}/images/fwup_include/provisioning.conf")

# Default paths if not specified via the commandline
define(ROOTFS, "${NERVES_SYSTEM}/images/rootfs.squashfs")

# The Rockchip boot ROM, miniloader and vendor U-Boot from the stock
# firmware stay where they are, and are never written by these firmware
# files. Only the GPT is rewritten. The first four partitions keep their
# stock names, GUIDs and locations, since the miniloader and U-Boot look
# them up by name.
#
# +-------------------------------------+ <-- sector 0
# | GPT                                 |
# +-------------------------------------+ <-- sector 64
# | idbloader (DDR init + miniloader)   |  stock, not in the GPT
# +-------------------------------------+ <-- sector 16384 (8 MiB)
# | p1: uboot    (vendor U-Boot)        |  stock
# | p2: trust    (BL31)                 |  stock
# | p3: misc     (Android BCB, zeroed)  |  stock
# | p4: resource (U-Boot logo + DTB)    |  stock
# +-------------------------------------+ <-- sector 73728 (36 MiB)
# | Nerves firmware configuration       |
# | (formatted as a U-Boot env, 128 KiB)|
# +-------------------------------------+ <-- sector 77824 (38 MiB)
# | p5: nerves_boot (FAT, bootable)     |
# |     boot.scr, Image.{a,b}, dtb.{a,b}|
# +-------------------------------------+
# | p6: Rootfs A (squashfs)             |
# +-------------------------------------+
# | p7: Rootfs B (squashfs)             |
# +-------------------------------------+
# | p8: Application (ext4)              |
# +-------------------------------------+
#
# The vendor U-Boot only finds boot.scr through distro boot, after its
# Android and Rockchip boot attempts fail. None of the Nerves partitions
# may be named "boot", "kernel" or "recovery", or those attempts would try
# to use them.

define(UBOOT_PART_OFFSET, 16384)
define(UBOOT_PART_COUNT, 8192)
define(TRUST_PART_OFFSET, 24576)
define(TRUST_PART_COUNT, 8192)
define(MISC_PART_OFFSET, 32768)
define(MISC_PART_COUNT, 8192)
define(RESOURCE_PART_OFFSET, 40960)
define(RESOURCE_PART_COUNT, 32768)

# The Nerves U-Boot environment is outside of any partition. boot.scr reads
# and writes it with raw MMC commands. NOTE: This must match
# rootfs_overlay/etc/fw_env.config and uboot/boot.cmd.
define(UBOOT_ENV_OFFSET, 73728)
define(UBOOT_ENV_COUNT, 256)  # 128 KiB

# The boot partition holds two uncompressed arm64 kernels (the vendor
# U-Boot's booti can't decompress), two device trees and boot.scr.
define(BOOT_PART_OFFSET, 77824)
define(BOOT_PART_COUNT, 262144) # 128 MiB

# Let each rootfs have room to grow up to 512 MiB
define-eval(ROOTFS_A_PART_OFFSET, "${BOOT_PART_OFFSET} + ${BOOT_PART_COUNT}")
define(ROOTFS_A_PART_COUNT, 1048576)
define-eval(ROOTFS_B_PART_OFFSET, "${ROOTFS_A_PART_OFFSET} + ${ROOTFS_A_PART_COUNT}")
define(ROOTFS_B_PART_COUNT, ${ROOTFS_A_PART_COUNT})

# Application partition. This partition can occupy all of the remaining space.
# Size it to fit the destination.
define-eval(APP_PART_OFFSET, "${ROOTFS_B_PART_OFFSET} + ${ROOTFS_B_PART_COUNT}")
define(APP_PART_COUNT, 1048576)

# GPT identifiers. The rootfs GUIDs double as the root= kernel arguments
# (root=PARTUUID=...) in uboot/boot.cmd.
define(DISK_UUID, "4b7c2a1e-3f6d-4e8a-9b5c-1d2e3f405162")
define(LINUX_PART_TYPE, "0fc63daf-8483-4772-8e79-3d69d8477de4") # Linux filesystem
define(BOOT_PART_TYPE, "ebd0a0a2-b9e5-4433-87c0-68b6b72699c7")  # Microsoft basic data (FAT)

# Stock Rockchip partitions: same type and partition GUIDs as the factory GPT
define(UBOOT_PART_TYPE, "fc1d0000-0000-4d4a-8000-703300007ac9")
define(UBOOT_PART_GUID, "33260000-0000-4208-8000-1ad80000670c")
define(TRUST_PART_TYPE, "10220000-0000-4149-8000-185f00006e0d")
define(TRUST_PART_GUID, "5b730000-0000-430a-8000-763000003306")
define(MISC_PART_TYPE, "1e650000-0000-4066-8000-53f600001c6e")
define(MISC_PART_GUID, "a17e0000-0000-4268-8000-329900002a00")
define(RESOURCE_PART_TYPE, "6d4e0000-0000-4255-8000-464200003fb4")
define(RESOURCE_PART_GUID, "4c410000-0000-4904-8000-4459000078c4")

define(BOOT_PART_GUID, "8d6f3b2a-5c4e-4f1a-9e7d-2b3c4d5e6f70")
define(ROOTFS_A_PART_GUID, "a1b2c3d4-0a0a-4e5f-8a6b-7c8d9e0f1a2b")
define(ROOTFS_B_PART_GUID, "b1b2c3d4-0b0b-4e5f-8a6b-7c8d9e0f1a2b")
define(APP_PART_GUID, "c1b2c3d4-0c0c-4e5f-8a6b-7c8d9e0f1a2b")

# Firmware archive metadata
meta-product = ${NERVES_FW_PRODUCT}
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}
meta-vcs-identifier = ${NERVES_FW_VCS_IDENTIFIER}
meta-misc = ${NERVES_FW_MISC}
