# GPT layouts shared by fwup.conf and fwup-ops.conf
#
# The vendor U-Boot boots the partition named "boot", or "recovery" once
# after a "reboot recovery" (see fwup-common.conf). The validated slot's
# boot image partition is named "boot" and the other one "recovery", so
# there's one layout per validated slot. They differ only in the names and
# type GUIDs of partitions 4 and 5; every partition keeps its location,
# GUID and Linux partition number.

gpt gpt-boot-a {
    guid = ${DISK_UUID}

    partition 0 {
        block-offset = ${UBOOT_PART_OFFSET}
        block-count = ${UBOOT_PART_COUNT}
        type = ${UBOOT_PART_TYPE}
        guid = ${UBOOT_PART_GUID}
        name = "uboot"
    }
    partition 1 {
        block-offset = ${TRUST_PART_OFFSET}
        block-count = ${TRUST_PART_COUNT}
        type = ${TRUST_PART_TYPE}
        guid = ${TRUST_PART_GUID}
        name = "trust"
    }
    partition 2 {
        block-offset = ${MISC_PART_OFFSET}
        block-count = ${MISC_PART_COUNT}
        type = ${MISC_PART_TYPE}
        guid = ${MISC_PART_GUID}
        name = "misc"
    }
    partition 3 {
        block-offset = ${RESOURCE_PART_OFFSET}
        block-count = ${RESOURCE_PART_COUNT}
        type = ${RESOURCE_PART_TYPE}
        guid = ${RESOURCE_PART_GUID}
        name = "resource"
    }
    partition 4 {
        block-offset = ${BOOT_A_PART_OFFSET}
        block-count = ${BOOT_A_PART_COUNT}
        type = ${BOOT_PART_TYPE}
        guid = ${BOOT_A_PART_GUID}
        name = "boot"
    }
    partition 5 {
        block-offset = ${BOOT_B_PART_OFFSET}
        block-count = ${BOOT_B_PART_COUNT}
        type = ${RECOVERY_PART_TYPE}
        guid = ${BOOT_B_PART_GUID}
        name = "recovery"
    }
    partition 6 {
        block-offset = ${ROOTFS_A_PART_OFFSET}
        block-count = ${ROOTFS_A_PART_COUNT}
        type = ${LINUX_PART_TYPE}
        guid = ${ROOTFS_A_PART_GUID}
        name = "rootfs_a"
    }
    partition 7 {
        block-offset = ${ROOTFS_B_PART_OFFSET}
        block-count = ${ROOTFS_B_PART_COUNT}
        type = ${LINUX_PART_TYPE}
        guid = ${ROOTFS_B_PART_GUID}
        name = "rootfs_b"
    }
    partition 8 {
        block-offset = ${APP_PART_OFFSET}
        block-count = ${APP_PART_COUNT}
        type = ${LINUX_PART_TYPE}
        guid = ${APP_PART_GUID}
        name = "app"
        expand = true
    }
}

gpt gpt-boot-b {
    guid = ${DISK_UUID}

    partition 0 {
        block-offset = ${UBOOT_PART_OFFSET}
        block-count = ${UBOOT_PART_COUNT}
        type = ${UBOOT_PART_TYPE}
        guid = ${UBOOT_PART_GUID}
        name = "uboot"
    }
    partition 1 {
        block-offset = ${TRUST_PART_OFFSET}
        block-count = ${TRUST_PART_COUNT}
        type = ${TRUST_PART_TYPE}
        guid = ${TRUST_PART_GUID}
        name = "trust"
    }
    partition 2 {
        block-offset = ${MISC_PART_OFFSET}
        block-count = ${MISC_PART_COUNT}
        type = ${MISC_PART_TYPE}
        guid = ${MISC_PART_GUID}
        name = "misc"
    }
    partition 3 {
        block-offset = ${RESOURCE_PART_OFFSET}
        block-count = ${RESOURCE_PART_COUNT}
        type = ${RESOURCE_PART_TYPE}
        guid = ${RESOURCE_PART_GUID}
        name = "resource"
    }
    partition 4 {
        block-offset = ${BOOT_A_PART_OFFSET}
        block-count = ${BOOT_A_PART_COUNT}
        type = ${RECOVERY_PART_TYPE}
        guid = ${BOOT_A_PART_GUID}
        name = "recovery"
    }
    partition 5 {
        block-offset = ${BOOT_B_PART_OFFSET}
        block-count = ${BOOT_B_PART_COUNT}
        type = ${BOOT_PART_TYPE}
        guid = ${BOOT_B_PART_GUID}
        name = "boot"
    }
    partition 6 {
        block-offset = ${ROOTFS_A_PART_OFFSET}
        block-count = ${ROOTFS_A_PART_COUNT}
        type = ${LINUX_PART_TYPE}
        guid = ${ROOTFS_A_PART_GUID}
        name = "rootfs_a"
    }
    partition 7 {
        block-offset = ${ROOTFS_B_PART_OFFSET}
        block-count = ${ROOTFS_B_PART_COUNT}
        type = ${LINUX_PART_TYPE}
        guid = ${ROOTFS_B_PART_GUID}
        name = "rootfs_b"
    }
    partition 8 {
        block-offset = ${APP_PART_OFFSET}
        block-count = ${APP_PART_COUNT}
        type = ${LINUX_PART_TYPE}
        guid = ${APP_PART_GUID}
        name = "app"
        expand = true
    }
}
