name: CI

# Builds the system on every push. A `vX.Y.Z` tag matching VERSION also
# drafts a GitHub release with the artifact, which Nerves projects download
# instead of building the system themselves (see `artifact_sites` in mix.exs).
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match mise.toml and the OTP that nerves_system_br ships
  OTP_VERSION: 29.1.2
  ELIXIR_VERSION: 1.20.4-otp-29
  NERVES_BOOTSTRAP_VERSION: 1.17.3

permissions:
  contents: read

jobs:
  get-br-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: gridpoint-com/actions-nerves-system@v1.0.4
      - name: Get Buildroot dependencies
        uses: ./.actions/get-br-dependencies
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
          nerves-bootstrap-version: ${{ env.NERVES_BOOTSTRAP_VERSION }}

  build-system:
    needs: [get-br-dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      # Mesa needs host LLVM and Clang, which take more disk than a stock
      # runner has free. Drop preinstalled SDKs this build doesn't use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift /usr/local/julia* /opt/az /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null
          df -h /
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bc build-essential cmake cpio curl file git \
            libncurses-dev libssl-dev m4 pkg-config python3 rsync \
            squashfs-tools unzip wget
      - uses: actions/checkout@v4
      # These steps follow gridpoint's build-system action, which can't find
      # the toolchain to key its ccache on with this Buildroot's download
      # layout. The cache is restored and saved separately so a failed or
      # timed-out build still speeds up the next one.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - name: Install nerves_bootstrap
        run: mix archive.install --force hex nerves_bootstrap ${{ env.NERVES_BOOTSTRAP_VERSION }}
      - name: Restore Buildroot downloads
        uses: actions/cache/restore@v4
        with:
          path: ~/.nerves/dl
          key: nerves-dl-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            nerves-dl-${{ github.ref_name }}
            nerves-dl-main
            nerves-dl
      - name: Fetch Mix dependencies
        run: mix deps.get
      - name: Validate Hex package
        run: mix hex.build
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.buildroot-ccache
          key: buildroot-ccache-${{ github.sha }}
          restore-keys: buildroot-ccache-
      - name: Build
        id: build
        timeout-minutes: 330
        run: |
          export BR2_CCACHE=y
          export BR2_CCACHE_DIR=$HOME/.buildroot-ccache
          export BR2_CCACHE_INITIAL_SETUP=--max-size=4G
          mix compile
      - name: Save ccache
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: ~/.buildroot-ccache
          key: buildroot-ccache-${{ github.sha }}
      - name: Lint
        run: |
          if mix help nerves.system.lint > /dev/null 2>&1; then
            mix nerves.system.lint nerves_defconfig
          fi
      - name: Create artifacts
        run: |
          mkdir -p deploy/system/artifacts
          cp CHANGELOG.md deploy/system/CHANGELOG.md
          mix nerves.artifact ${GITHUB_REPOSITORY#*/} --path deploy/system/artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: system
          path: deploy/system/artifacts
      # deploy-system (gridpoint's deploy action) restores this
      - name: Save deploy cache
        uses: actions/cache/save@v4
        with:
          path: deploy/system
          key: deploy/system-${{ github.sha }}-${{ github.ref_name }}

  deploy-system:
    needs: [build-system]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: gridpoint-com/actions-nerves-system@v1.0.4
      - name: Draft a GitHub release with the artifact
        uses: ./.actions/deploy-system
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
